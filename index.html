<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI3 南港美食 3D 午餐選擇器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ========== 1. CSS Reset & Canvas 全螢幕佈局 ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    color: #f4f1ea;
    background: radial-gradient(ellipse at 65% 40%, #2b2350 0%, #15122b 55%, #0b0a17 100%);
  }
  #canvas-container { position: fixed; inset: 0; z-index: 0; }
  #canvas-container canvas { display: block; }

  /* ========== 2. 控制面板 UI（玻璃擬態） ========== */
  .glass {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  #ui-container { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  header {
    position: absolute; top: 16px; left: 16px; right: 16px;
    padding: 14px 22px; border-radius: 16px;
    display: flex; align-items: center; gap: 12px;
    pointer-events: auto;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header .tag {
    margin-left: auto; font-size: 12px; opacity: .75;
    display: flex; align-items: center; gap: 6px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
    background: linear-gradient(135deg, #ffb347, #ff5e62); color: #fff;
  }

  #filter-panel {
    position: absolute; top: 96px; left: 16px; bottom: 16px; width: 300px;
    border-radius: 18px; padding: 20px;
    display: flex; flex-direction: column; gap: 18px;
    overflow-y: auto; pointer-events: auto;
  }
  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    opacity: .7; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg input, .chips input, .switch input { display: none; }
  .seg label {
    text-align: center; padding: 10px 4px; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    font-size: 14px; transition: all .2s;
  }
  .seg label small { display: block; font-size: 10px; opacity: .6; margin-top: 2px; }
  .seg input:checked + label {
    background: linear-gradient(135deg, rgba(255,179,71,.35), rgba(255,94,98,.35));
    border-color: #ffb347; color: #fff;
  }
  .switch label {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 12px 14px; border-radius: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); font-size: 14px;
  }
  .switch .knob {
    width: 42px; height: 24px; border-radius: 12px; background: rgba(255,255,255,.2);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .switch .knob::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .switch input:checked + label .knob { background: #4cd4a0; }
  .switch input:checked + label .knob::after { transform: translateX(18px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label {
    padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    transition: all .2s; user-select: none;
  }
  .chips input:checked + label { background: rgba(76,212,160,.25); border-color: #4cd4a0; color: #fff; }
  .chips-actions { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; }
  .chips-actions button { background: none; border: none; color: #ffb347; cursor: pointer; font-size: 12px; }

  #count-box {
    margin-top: auto; padding: 12px 14px; border-radius: 12px; font-size: 14px;
    background: rgba(0,0,0,.25); display: flex; align-items: center; gap: 8px;
  }
  #count-box b { font-size: 22px; color: #ffb347; }
  #count-box.empty b { color: #ff6b6b; }
  #count-hint { font-size: 12px; color: #ff8a8a; display: none; }
  #count-box.empty + #count-hint { display: block; }

  .btn {
    border: none; cursor: pointer; border-radius: 12px; font-weight: 700; font-size: 16px;
    padding: 14px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s, box-shadow .2s, opacity .2s; font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, #ffb347, #ff5e62); color: #fff;
    box-shadow: 0 8px 24px rgba(255, 94, 98, .4);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(255, 94, 98, .6); }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; transform: none; }
  #spin-btn { width: 100%; font-size: 18px; padding: 16px; }

  #wheel-note {
    position: absolute; bottom: 20px; right: 20px; font-size: 12px; opacity: .55;
    pointer-events: none; text-align: right;
  }
  #webgl-error {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 5; text-align: center; padding: 20px;
  }

  /* ========== 3. 結果彈窗與按鈕 ========== */
  #result-modal {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(5, 4, 15, .55); transition: opacity .3s; padding: 16px;
  }
  #result-modal.hidden { opacity: 0; pointer-events: none; }
  .card {
    width: min(420px, 100%); border-radius: 22px; padding: 28px 26px 22px; text-align: center;
    transform: translateY(0) scale(1); transition: transform .35s cubic-bezier(.2,1.4,.4,1);
    background: rgba(30, 26, 58, .85);
  }
  #result-modal.hidden .card { transform: translateY(30px) scale(.9); }
  .card .eyebrow { font-size: 13px; letter-spacing: 2px; opacity: .7; }
  .card h2 { font-size: 28px; margin: 10px 0 6px; line-height: 1.3; }
  .card .dist { font-size: 15px; opacity: .85; margin-bottom: 14px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 22px; }
  .card .tags span {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  }
  .card .tags span.ac { border-color: #4cd4a0; color: #8ff0c8; }
  .card .tags span.noac { border-color: #ff9f6b; color: #ffc29e; }
  .card .actions { display: grid; gap: 10px; }
  .btn-ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.18); font-size: 15px; padding: 12px; }
  .btn-ghost:hover { background: rgba(255,255,255,.18); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ========== RWD：窄螢幕時篩選面板移到底部 ========== */
  @media (max-width: 820px) {
    header { top: 10px; left: 10px; right: 10px; padding: 10px 14px; }
    header h1 { font-size: 16px; }
    header .tag { display: none; }
    #filter-panel {
      top: auto; left: 10px; right: 10px; bottom: 10px; width: auto;
      max-height: 48vh; padding: 14px; gap: 12px;
    }
    #wheel-note { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- 3D 畫布容器 -->
<div id="canvas-container"></div>

<!-- 前端篩選 UI 層 -->
<div id="ui-container">
  <header class="glass">
    <div class="logo">AI3</div>
    <h1>AI3 南港午餐 3D 決策器</h1>
    <div class="tag"><i class="fa-solid fa-location-dot"></i> 南港軟體園區・三重路 半徑 2km</div>
  </header>

  <aside id="filter-panel" class="glass">
    <div>
      <div class="section-title"><i class="fa-solid fa-person-walking"></i> 距離選擇</div>
      <div class="seg">
        <input type="radio" name="dist" id="d500" value="500"><label for="d500">500m<small>園區內</small></label>
        <input type="radio" name="dist" id="d1000" value="1000"><label for="d1000">1km<small>展覽館站</small></label>
        <input type="radio" name="dist" id="d2000" value="2000" checked><label
